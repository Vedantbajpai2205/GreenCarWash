<div class="bg-image"></div>
<div class="wrapper">
  <div class="container mt-5">
    <h2>Register</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full Name</label>
        <input formControlName="fullName" type="text" class="form-control" placeholder="Enter your full name" />
      </div>

      <div class="form-group mt-3">
        <label>Email</label>
        <input formControlName="email" type="email" class="form-control" placeholder="Enter your email" />
      </div>

      <div class="form-group mt-3">
        <label>Password</label>
        <input formControlName="password" type="password" class="form-control" placeholder="Enter your password" />
      </div>

      <div class="form-group mt-3">
        <label>Phone</label>
        <input formControlName="phone" type="text" class="form-control" placeholder="Optional phone number" />
      </div>

      <div class="form-group mt-3">
        <label>Role</label>
        <select formControlName="role" class="form-control">
          <option value="">Select Role</option>
          <option value="CUSTOMER">Customer</option>
          <option value="WASHER">Washer</option>
          <!-- <option value="ADMIN">Admin</option> -->
        </select>
      </div>

      <button type="submit" class="btn btn-success mt-4" [disabled]="registerForm.invalid">Register</button>
    </form>
    <p class="mt-3">
      Already have an account?
      <a routerLink="/login" href="/login">Login here</a>
    </p>
  </div>
</div>
