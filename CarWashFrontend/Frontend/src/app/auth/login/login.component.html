<div class="bg-image"></div>
<div class="wrapper">
  <div class="container mt-5">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" type="email" class="form-control" placeholder="Enter your email" />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger">
          Valid email is required.
        </div>
      </div>
      <div class="form-group mt-3">
        <label>Password</label>
        <input formControlName="password" type="password" class="form-control" placeholder="Enter your password" />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger">
          Password is required.
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-4" [disabled]="loginForm.invalid">Login</button>
    </form>
    <p class="mt-3">
      Don't have an account?
      <a routerLink="/register" href="/register">Register here</a>
    </p>
  </div>
</div>
